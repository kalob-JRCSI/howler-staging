name: Refresh Cloudflare Types Once

on:
  push:
    branches:
      - claude/v096-contractor-hub
    paths:
      - .github/workflows/refresh-cf-types-once.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v6.0.0
        with:
          node-version: 24.20.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Regenerate Cloudflare types
        run: npm run cf-typegen
      - name: Commit generated types
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker-configuration.d.ts
          if git diff --cached --quiet; then
            echo "Cloudflare types already current."
            exit 0
          fi
          git commit -m "chore(types): refresh Cloudflare generated bindings"
          git push origin HEAD:claude/v096-contractor-hub

name: Deploy Howler

on:
  workflow_dispatch:
  push:
    branches:
      - deploy/howler-os
    paths:
      - howler-os/**
      - .github/workflows/deploy-howler.yml

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: howler-os/package-lock.json

      - name: Install Howler
        working-directory: howler-os
        run: npm install

      - name: Build Howler for Cloudflare
        working-directory: howler-os
        run: npm run build:howler

      - name: Isolate Howler wrangler
        working-directory: howler-os
        run: rm -rf .wrangler

      - name: Deploy Howler Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: howler-os/.output/server
          command: deploy

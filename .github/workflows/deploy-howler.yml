name: Deploy Howler

on:
  workflow_dispatch:
  push:
    branches:
      - deploy/howler-os
    paths:
      - howler-os/**
      - .github/workflows/deploy-howler.yml

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: howler-os/package-lock.json

      - name: Install Howler
        working-directory: howler-os
        run: npm install

      - name: Build Howler for Cloudflare
        working-directory: howler-os
        run: npm run build:howler

      - name: Stage Howler away from the staging Worker wrangler
        run: |
          dest="$RUNNER_TEMP/howler-cf"
          rm -rf "$dest"
          mkdir -p "$dest"
          cp -a howler-os/.output/server/. "$dest/"
          cp -a howler-os/.output/public "$dest/public"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "howler-cf" / "wrangler.json"
          cfg = json.loads(path.read_text())
          cfg["name"] = "howler"
          cfg["main"] = "index.mjs"
          cfg["compatibility_date"] = "2024-09-19"
          cfg["compatibility_flags"] = ["nodejs_compat"]
          cfg["assets"] = {"binding": "ASSETS", "directory": "./public"}
          cfg.pop("d1_databases", None)
          cfg.pop("vars", None)
          path.write_text(json.dumps(cfg, indent=2) + "\n")
          print(path.read_text())
          PY

      - name: Deploy Howler Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: ${{ runner.temp }}/howler-cf
          command: deploy

name: Activate Howler v0.9.6 Pilot Staging

on:
  push:
    branches:
      - deploy/v096-pilot-20260908
    paths:
      - .github/workflows/activate-pilot.yml

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6.0.0
        with:
          node-version: 24.20.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Activate and verify staging pilot data through remote-development Worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          admin_key="$(openssl rand -hex 32)"
          confirmation_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$admin_key"
          echo "::add-mask::$confirmation_secret"

          cleanup() {
            if [ -f /tmp/howler-remote-dev.pid ]; then
              kill "$(cat /tmp/howler-remote-dev.pid)" 2>/dev/null || true
            fi
            rm -f .dev.vars
          }
          trap cleanup EXIT

          cat > .dev.vars <<EOF
          HOWLER_ADMIN_KEY="$admin_key"
          HOWLER_CONFIRMATION_SIGNING_SECRET="$confirmation_secret"
          EOF

          npx wrangler dev --remote --ip 127.0.0.1 --port 8787 --log-level warn > /tmp/howler-remote-dev.log 2>&1 &
          echo $! > /tmp/howler-remote-dev.pid

          ready=0
          for attempt in $(seq 1 45); do
            if curl --silent --output /dev/null http://127.0.0.1:8787/; then
              ready=1
              break
            fi
            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            echo "Remote-development Worker did not become ready." >&2
            tail -100 /tmp/howler-remote-dev.log >&2 || true
            exit 1
          fi

          HOWLER_ADMIN_KEY="$admin_key" HOWLER_BASE_URL="http://127.0.0.1:8787" \
            node scripts/activate-pilot.ts --base-url http://127.0.0.1:8787

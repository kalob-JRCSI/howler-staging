name: Verify Howler Recovery

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prettier diagnostic
        run: npx prettier src/worker/index.ts

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Generate Cloudflare types
        run: npm run cf-typegen

      - name: Upload generated Cloudflare types
        uses: actions/upload-artifact@v6
        with:
          name: worker-configuration
          path: worker-configuration.d.ts
          if-no-files-found: error

      - name: Wrangler dry-run build
        run: npm run build:dry

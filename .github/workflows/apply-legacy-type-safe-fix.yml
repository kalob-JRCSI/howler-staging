name: Apply Type Safe Legacy Forecast Fix

on:
  push:
    branches:
      - fix/v096-pilot-portfolio-legacy
    paths:
      - .github/workflows/apply-legacy-type-safe-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/v096-pilot-portfolio-legacy
      - uses: actions/setup-node@v6.0.0
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci
      - name: Replace lint-invalid optional chains with explicit persisted-legacy adapter
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/operator/project-summary.ts')
          text = p.read_text()
          marker = '// Production progress only: weighted by each activity\'s likely-duration estimate, never by\n'
          helper = '''// Persisted staging data includes forecast snapshots created before recoveryAnalysis was added.\n// Current in-memory forecasts always carry it, but read-side summaries must remain compatible with\n// those immutable historical snapshots instead of letting one older row abort the whole portfolio.\ntype PersistedForecastWithLegacyRecovery = Omit<\n  ForecastSnapshotV094,\n  "recoveryAnalysis"\n> & {\n  recoveryAnalysis?: ForecastSnapshotV094["recoveryAnalysis"];\n};\n\nfunction criticalExposureCountFromPersistedForecast(\n  forecast: ForecastSnapshotV094 | undefined,\n): number {\n  const persisted = forecast as PersistedForecastWithLegacyRecovery | undefined;\n  return persisted?.recoveryAnalysis?.criticalExposureCount ?? 0;\n}\n\n'''
          if 'criticalExposureCountFromPersistedForecast' not in text:
              if marker not in text:
                  raise SystemExit('insertion marker not found')
              text = text.replace(marker, helper + marker, 1)
          text = text.replace(
              'forecast?.recoveryAnalysis?.criticalExposureCount ?? 0',
              'criticalExposureCountFromPersistedForecast(forecast)',
          )
          if 'forecast?.recoveryAnalysis?.criticalExposureCount' in text:
              raise SystemExit('legacy lint-invalid access still present')
          p.write_text(text)
          PY
          npx prettier --write src/operator/project-summary.ts
      - name: Verify targeted regression and lint
        run: |
          npx vitest run test/unit/project-summary-legacy-forecast.test.ts
          npm run lint
      - name: Commit minimal type-safe fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/operator/project-summary.ts
          git commit -m "fix: adapt legacy persisted forecasts for summaries"
          git push origin HEAD:fix/v096-pilot-portfolio-legacy

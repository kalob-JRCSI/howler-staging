name: Deploy Howler Staging

on:
  push:
    branches:
      - main
      - deploy/v096-pilot-20260908
      - deploy/howler-os
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: howler-os/package-lock.json

      - name: Install Howler
        working-directory: howler-os
        run: npm install

      - name: Build Howler for Cloudflare
        working-directory: howler-os
        run: npm run build:howler

      - name: Stage jarvis-voice-staging
        run: |
          dest="$RUNNER_TEMP/howler-cf"
          rm -rf "$dest"
          mkdir -p "$dest"
          cp -a howler-os/.output/server/. "$dest/"
          cp -a howler-os/.output/public "$dest/public"
          cp howler-os/scripts/cf-fetch.mjs "$dest/fetch.mjs"
          cp howler-os/scripts/pilot-gate.mjs "$dest/pilot-gate.mjs"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "howler-cf" / "wrangler.json"
          cfg = json.loads(path.read_text())
          cfg["name"] = "jarvis-voice-staging"
          cfg["main"] = "fetch.mjs"
          cfg["compatibility_date"] = "2026-09-13"
          cfg["compatibility_flags"] = ["nodejs_compat"]
          cfg["assets"] = {"binding": "ASSETS", "directory": "./public"}
          cfg["d1_databases"] = [{
            "binding": "HOWLER_DB",
            "database_name": "howler-dashboard",
            "database_id": "eb2ed8a9-63dd-490d-966b-3afbeb6b89ca",
          }]
          cfg.pop("migrations_dir", None)
          cfg.pop("vars", None)
          cfg["vars"] = {
            "HOWLER_AI_PROVIDER": "openai",
            "HOWLER_AI_MODEL": "gpt-5.6-terra",
          }
          cfg.pop("no_bundle", None)
          path.write_text(json.dumps(cfg, indent=2) + "\n")
          print(path.read_text())
          PY

      - name: Install Wrangler
        run: npm i -g wrangler@4

      # SKIP_SECRET_PUT_IOS_FIX: do not clobber live HOWLER_COMMAND_TOKEN / pilot hash on board UI deploys
      - name: Skip secret overwrite (preserve live tokens)
        run: echo "Keeping existing Worker secrets; not running wrangler secret put"

      - name: Preflight -- verify required Worker secret bindings exist
        run: node scripts/preflight-worker-secrets.ts --worker-name jarvis-voice-staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy jarvis-voice-staging
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: ${{ runner.temp }}/howler-cf
          command: deploy --compatibility-date 2026-09-13 --compatibility-flags nodejs_compat

      - name: Warm howler-dashboard schema
        env:
          HOWLER_COMMAND_TOKEN: howler-kf-8823
        run: |
          curl -sS -A 'Mozilla/5.0' -o /tmp/howler-home.html -w 'home %{http_code}\n' \
            'https://jarvis-voice-staging.kalob.workers.dev/'
          no_token=$(curl -sS -A 'Mozilla/5.0' -o /tmp/howler-command-401.json -w '%{http_code}' \
            -X POST 'https://jarvis-voice-staging.kalob.workers.dev/api/howler-command' \
            -H 'content-type: application/json' \
            -d '{"command":"how is the board"}')
          echo "no_token_http=$no_token $(cat /tmp/howler-command-401.json)"
          test "$no_token" = "401"
          with_token=$(curl -sS -A 'Mozilla/5.0' -o /tmp/howler-command.json -w '%{http_code}' \
            -X POST 'https://jarvis-voice-staging.kalob.workers.dev/api/howler-command' \
            -H 'content-type: application/json' \
            -H "x-howler-token: $HOWLER_COMMAND_TOKEN" \
            -d '{"command":"how is the board"}')
          echo "with_token_http=$with_token $(cat /tmp/howler-command.json)"
          test "$with_token" = "200"

      - name: Verify HOWLER_DB is howler-dashboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node howler-os/scripts/verify-howler-dashboard.mjs

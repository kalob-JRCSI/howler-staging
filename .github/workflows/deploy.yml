name: Deploy Howler Staging

on:
  push:
    branches:
      - main
      - deploy/v096-pilot-20260908
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6.0.0
        with:
          node-version: 24.20.0
          cache: npm

      - name: Install dependencies (npm ci)
        run: npm ci

      # Fails closed before deployment if any required Howler Worker secret binding is missing.
      # Verification is by binding NAME only via `wrangler secret list`; secret values are never read.
      - name: Preflight -- verify required Worker secret bindings exist
        run: node scripts/preflight-worker-secrets.ts --worker-name jarvis-voice-staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy jarvis-voice-staging
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"

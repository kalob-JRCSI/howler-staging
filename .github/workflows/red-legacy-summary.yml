name: RED Legacy Summary Regression

on:
  push:
    branches:
      - fix/v096-pilot-portfolio-legacy
    paths:
      - .github/workflows/red-legacy-summary.yml

jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6.0.0
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci
      - run: npx vitest run test/unit/project-summary-legacy-forecast.test.ts

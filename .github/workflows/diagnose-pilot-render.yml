name: Diagnose v0.9.6 Pilot Render

on:
  push:
    branches:
      - diagnose/v096-pilot-render
    paths:
      - .github/workflows/diagnose-pilot-render.yml

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6.0.0
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci

      - name: Inspect actual remote staging D1
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo '=== ACTUAL REMOTE D1 PROJECT COUNT ==='
          npx wrangler d1 execute howler-intelligence-staging --remote --command "SELECT COUNT(*) AS project_count FROM projects;"
          echo '=== ACTUAL REMOTE D1 PROJECT ROWS ==='
          npx wrangler d1 execute howler-intelligence-staging --remote --command "SELECT project_id, name, revision, updated_at FROM projects ORDER BY project_id;"

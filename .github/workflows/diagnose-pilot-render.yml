name: Diagnose v0.9.6 Pilot Render

on:
  push:
    branches:
      - diagnose/v096-pilot-render
    paths:
      - .github/workflows/diagnose-pilot-render.yml

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6.0.0
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci

      - name: Export actual staging models and latest forecasts
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute howler-intelligence-staging --remote --json --command "SELECT p.project_id, p.current_model_json, (SELECT f.snapshot_json FROM forecast_snapshots f WHERE f.project_id = p.project_id ORDER BY f.version DESC LIMIT 1) AS snapshot_json FROM projects p ORDER BY p.project_id;" > /tmp/howler-rows.json

      - name: Replay production summary builder over every actual staging project
        shell: bash
        run: |
          set -euo pipefail
          cat > diagnose-summary.ts <<'TS'
          import fs from "node:fs";
          import { buildProjectSummary } from "./src/operator/project-summary";
          import { projectHealth } from "./src/worker/health";

          const raw = JSON.parse(fs.readFileSync("/tmp/howler-rows.json", "utf8"));
          const rows = Array.isArray(raw) ? (raw[0]?.results ?? []) : [];
          let failed = false;
          for (const row of rows) {
            try {
              const model = JSON.parse(row.current_model_json);
              const forecast = row.snapshot_json ? JSON.parse(row.snapshot_json) : undefined;
              const health = await projectHealth(
                { loadPredictionOutcomes: async () => [] },
                model,
                forecast,
              );
              const summary = buildProjectSummary(model, forecast, health);
              console.log(`SUMMARY_OK ${row.project_id} | ${summary.projectName} | ${summary.progressPercent} | ${summary.primaryExposure} | ${summary.nextMovement}`);
            } catch (error) {
              failed = true;
              console.error(`SUMMARY_FAIL ${row.project_id}: ${error instanceof Error ? error.stack : String(error)}`);
            }
          }
          if (failed) process.exit(1);
          TS
          npx vite-node diagnose-summary.ts
          rm -f diagnose-summary.ts
